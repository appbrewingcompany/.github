name: Auto Assign Reviewer and Assignee (Reusable)

on:
  workflow_call:

jobs:
  assign:
    runs-on: ubuntu-latest

    # Prevent duplicate runs for the same PR
    concurrency:
      group: auto-assign-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    permissions:
      pull-requests: write
      issues: write
      contents: read

    steps:
      - name: Assign PR author and default CODEOWNERS reviewer
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # ── 1. Assign the PR author as the assignee ──
          echo "Assigning PR author ($PR_AUTHOR) as the assignee..."
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-assignee "$PR_AUTHOR"

          # ── 2. Check if reviewers are already requested ──
          REQUESTED_REVIEWERS=$(gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json reviewRequests --jq '.reviewRequests | length')

          if [ "$REQUESTED_REVIEWERS" -gt 0 ]; then
            echo "PR already has $REQUESTED_REVIEWERS reviewer(s). Skipping."
            exit 0
          fi

          echo "No reviewers found. Looking up CODEOWNERS..."

          # ── 3. Fetch CODEOWNERS from the caller repo (no checkout needed) ──
          CODEOWNERS_CONTENT=""
          for path in .github/CODEOWNERS docs/CODEOWNERS CODEOWNERS; do
            CODEOWNERS_CONTENT=$(gh api \
              "repos/${REPO}/contents/${path}" \
              --jq '.content' 2>/dev/null | base64 --decode 2>/dev/null) && break
            CODEOWNERS_CONTENT=""
          done

          if [ -z "$CODEOWNERS_CONTENT" ]; then
            echo "No CODEOWNERS file found in $REPO."
            exit 0
          fi

          # ── 4. Extract the default '*' wildcard rule ──
          #    - Skip comment lines
          #    - Match lines starting with * followed by whitespace
          DEFAULT_RULE=$(echo "$CODEOWNERS_CONTENT" \
            | grep -v '^\s*#' \
            | grep -E '^\*[[:space:]]+' \
            | head -n 1)

          if [ -z "$DEFAULT_RULE" ]; then
            echo "No default '*' rule found in CODEOWNERS."
            exit 0
          fi

          echo "Found default rule: $DEFAULT_RULE"

          # ── 5. Parse owners, stripping the leading '@' ──
          RAW_REVIEWERS=$(echo "$DEFAULT_RULE" \
            | awk '{for(i=2;i<=NF;i++) print $i}' \
            | sed 's/^@//')

          # ── 6. Build the reviewer arguments, excluding the PR author ──
          GH_ARGS=()
          while IFS= read -r reviewer; do
            [ -z "$reviewer" ] && continue
            if [ "$reviewer" != "$PR_AUTHOR" ]; then
              GH_ARGS+=(--add-reviewer "$reviewer")
              echo "  → will request review from: $reviewer"
            else
              echo "  → skipping PR author: $reviewer"
            fi
          done <<< "$RAW_REVIEWERS"

          # ── 7. Apply the reviewers ──
          if [ ${#GH_ARGS[@]} -gt 0 ]; then
            echo "Requesting reviews..."
            gh pr edit "$PR_NUMBER" --repo "$REPO" "${GH_ARGS[@]}"
          else
            echo "No reviewers to assign (the only default owner is the PR author)."
          fi
