name: Version and Release

on:
  workflow_call:
    inputs:
      include-private:
        description: 'Include packages with `publish_to: none` when versioning.'
        type: boolean
        default: true
      tag:
        description: >-
          Let melos create git tags for the new versions (pushed together with
          the version commit). Set to false to version without tagging.
        type: boolean
        default: true
      git-name:
        description: Git author name for the version commit and tags.
        type: string
        default: github-actions[bot]
      git-email:
        description: Git author email for the version commit and tags.
        type: string
        default: 41898282+github-actions[bot]@users.noreply.github.com
    secrets:
      PAT_TOKEN:
        required: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # Never cancel version runs — could corrupt tags

env:
  MELOS_SDK_PATH: auto

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup Git User & Auth
        run: |
          git config --global user.name "${{ inputs.git-name }}"
          git config --global user.email "${{ inputs.git-email }}"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com" > ~/.git-credentials

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install Melos
        uses: bluefireteam/melos-action@2982f8e4fc92440a219490009d6d05195cb1a6a5 # v3.8.0

      - name: Setup FVM symlink for Melos
        run: |
          mkdir -p .fvm
          ln -s $FLUTTER_ROOT .fvm/flutter_sdk

      - name: Bootstrap Melos
        run: melos bootstrap

      # Explicit `melos version` step: the melos-action's `run-versioning`
      # hardcodes `--no-git-tag-version`, so releases were committed but never
      # tagged. Tags are required for tag_pattern-based git dependencies
      # (<package>-v<version>). Notes: only changelog files are excluded from
      # melos' package diff, and `chore:`-type commits never trigger a version
      # bump — use `fix:`/`feat:` for release-worthy changes.
      - name: Version Packages
        # NB: --all is the flag for including private (publish_to: none)
        # packages in versioning; --private is only a package filter. And
        # GitHub expressions treat '' as falsy, so never write
        # `X && '' || Y` — it always yields Y.
        run: >-
          melos version --yes
          ${{ inputs.include-private && '--all' || '' }}
          ${{ inputs.tag == false && '--no-git-tag-version' || '' }}

      - name: Push Version Commit & Tags
        run: git push --follow-tags
