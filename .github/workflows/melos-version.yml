name: Version and Release

on:
  workflow_call:
    inputs:
      git-name:
        description: Git author name for the version commit and tags.
        type: string
        default: github-actions[bot]
      git-email:
        description: Git author email for the version commit and tags.
        type: string
        default: 41898282+github-actions[bot]@users.noreply.github.com
    secrets:
      PAT_TOKEN:
        required: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # Never cancel version runs — could corrupt tags

env:
  MELOS_SDK_PATH: auto

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup Git User & Auth
        run: |
          git config --global user.name "${{ inputs.git-name }}"
          git config --global user.email "${{ inputs.git-email }}"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com" > ~/.git-credentials

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install Melos & Bootstrap
        uses: bluefireteam/melos-action@2982f8e4fc92440a219490009d6d05195cb1a6a5 # v3.8.0

      - name: Version packages (including private)
        run: melos version --yes --all

      - name: Push version commit & tags
        run: git push --follow-tags
