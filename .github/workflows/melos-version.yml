name: Melos Version and Release

on:
  workflow_call:
    inputs:
      git-name:
        description: Git author name for the version commit and tags.
        type: string
        default: github-actions[bot]
      git-email:
        description: Git author email for the version commit and tags.
        type: string
        default: 41898282+github-actions[bot]@users.noreply.github.com
    secrets:
      PAT_TOKEN:
        required: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # Never cancel version runs — could corrupt tags

env:
  MELOS_SDK_PATH: auto

jobs:
  version:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: appbrewingcompany/.github/.github/actions/melos-setup@main
        with:
          pat-token: ${{ secrets.PAT_TOKEN }}
          git-name: ${{ inputs.git-name }}
          git-email: ${{ inputs.git-email }}

      - name: Version packages (including private)
        run: melos version --yes --all

      - name: Push version commit & tags
        run: git push --follow-tags
