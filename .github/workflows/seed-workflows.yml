name: Seed Workflow Templates

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Target repository name"
        required: true
        type: string
      creator:
        description: "Username to add to CODEOWNERS (defaults to first committer)"
        required: false
        type: string
  repository_dispatch:
    types: [repo-created]

jobs:
  seed-workflows:
    runs-on: self-hosted
    steps:
      - name: Checkout .github repo
        uses: actions/checkout@v7

      - name: Process templates, bootstrap repo, and open Pull Request
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          INPUT_REPO: ${{ inputs.target_repo || github.event.client_payload.repo }}
          INPUT_CREATOR: ${{ inputs.creator || github.event.client_payload.creator }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          # 1. Normalize target repository name
          if [[ "${INPUT_REPO}" == *"/"* ]]; then
            TARGET_REPO="${INPUT_REPO}"
          else
            TARGET_REPO="${{ github.repository_owner }}/${INPUT_REPO}"
          fi

          echo "Resolving repository details for ${TARGET_REPO}..."
          DEFAULT_BRANCH=$(gh repo view "${TARGET_REPO}" --json defaultBranchRef --jq '.defaultBranchRef.name')
          echo "Target repo: ${TARGET_REPO}"
          echo "Default branch: ${DEFAULT_BRANCH}"

          # 2. Locate the root-level template directory
          TEMPLATE_DIR=""
          if [ -d "workflow-templates" ]; then
            TEMPLATE_DIR="workflow-templates"
          else
            echo "Error: Directory 'workflow-templates' not found at repository root."
            ls -la
            exit 1
          fi

          echo "Using template directory: ${TEMPLATE_DIR}"

          # 3. Stage and substitute templates
          OUT_DIR=$(mktemp -d)
          mkdir -p "${OUT_DIR}/.github/workflows"
          FOUND_FILES=0

          for template in "${TEMPLATE_DIR}"/*.yml "${TEMPLATE_DIR}"/*.yaml; do
            filename=$(basename "$template")
            echo "Transforming $filename..."

            sed -E "s/\\\$default[-_]branch/${DEFAULT_BRANCH}/g" "$template" > "${OUT_DIR}/.github/workflows/${filename}"
            FOUND_FILES=1
          done

          if [ "$FOUND_FILES" -eq 0 ]; then
            echo "No .yml or .yaml files found in ${TEMPLATE_DIR}."
            ls -la "${TEMPLATE_DIR}"
            exit 1
          fi

          # 4. Bootstrap: repo settings + PAT_TOKEN secret (before PR, works on empty repos too)
          echo "Applying standard repo settings..."
          gh api -X PATCH "repos/${TARGET_REPO}" \
            -f delete_branch_on_merge=true -F allow_update_branch=true > /dev/null

          echo "Copying PAT_TOKEN secret to ${TARGET_REPO}..."
          gh secret set PAT_TOKEN --repo "${TARGET_REPO}" --body "${PAT_TOKEN}"

          # 5. Determine creator for CODEOWNERS
          CREATOR="${INPUT_CREATOR}"
          if [ -z "${CREATOR}" ]; then
            CREATOR=$(gh api "repos/${TARGET_REPO}/commits?per_page=1" \
              --jq '.[0].committer.login // .[0].author.login // empty' || true)
          fi
          echo "CODEOWNERS creator: ${CREATOR:-unknown}"

          # 6. Clone target repo, commit workflows + CODEOWNERS, and open PR
          CLONE_DIR=$(mktemp -d)
          gh repo clone "${TARGET_REPO}" "${CLONE_DIR}" -- --depth 1

          cd "${CLONE_DIR}"

          # Configure git authentication and credentials using gh
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="automation/seed-workflows"
          git checkout -B "${BRANCH_NAME}"
          mkdir -p .github/workflows
          cp -r "${OUT_DIR}/.github/workflows/"* .github/workflows/

          # CODEOWNERS: creator first, default reviewer alongside.
          # Humans only — bot owners (e.g. appbrew-agent) would be
          # auto-requested as reviewer on every PR, waking the Hermes agent.
          case "${CREATOR}" in
            ""|web-flow|github-actions[bot]|*\[bot\]|appbrew-agent) CREATOR="";;
          esac
          if [ -n "${CREATOR}" ]; then
            mkdir -p .github
            if [ -f .github/CODEOWNERS ]; then
              grep -qE "^\* .*@${CREATOR}\b" .github/CODEOWNERS || \
                sed -i -E "0,/^\\* /s/^\\* (.*)$/* @${CREATOR} \1/" .github/CODEOWNERS
            else
              echo "* @${CREATOR} @ubergaijin" > .github/CODEOWNERS
            fi
          fi

          # 6b. Rename template placeholders to the new repo name
          #     (repos created from our template_* repos keep the template
          #     package name; rewrite it everywhere it appears)
          REPO_NAME="${TARGET_REPO##*/}"
          for T in template_dart_package template_flutter_package template_flutter_plugin template_flutter_app; do
            if grep -rq --exclude-dir=.git --exclude-dir=.dart_tool --exclude-dir=build "$T" .; then
              echo "Renaming template placeholder $T -> $REPO_NAME"
              grep -rl --exclude-dir=.git --exclude-dir=.dart_tool --exclude-dir=build "$T" . |
                xargs -r sed -i "s/$T/$REPO_NAME/g"
              break
            fi
          done

          git add -A
          git add .github
          if git diff --staged --quiet; then
            echo "Bootstrap already up to date. No changes to commit."
            exit 0
          fi

          git commit -m "ci: add standard workflow templates from .github"
          git push origin "${BRANCH_NAME}" --force
          # 7. Check for existing PR or create a new one
          EXISTING_PR=$(gh pr list --repo "${TARGET_REPO}" --head "${BRANCH_NAME}" --json number --jq '.[0].number')

          if [ -n "${EXISTING_PR}" ]; then
            echo "Pull Request #${EXISTING_PR} already exists in ${TARGET_REPO}."
          else
            gh pr create \
              --repo "${TARGET_REPO}" \
              --base "${DEFAULT_BRANCH}" \
              --head "${BRANCH_NAME}" \
              --title "ci: install organization workflow templates" \
              --body "Automated Pull Request adding standard CI/CD workflow templates configured for the \`${DEFAULT_BRANCH}\` branch.

          Bootstrapped by the repo-created automation: workflow templates, CODEOWNERS, \`PAT_TOKEN\` secret, and standard repo settings (delete-branch-on-merge, update-branch)."
          fi
