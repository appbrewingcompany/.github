name: Melos Analyze

on:
  workflow_call:
    secrets:
      PAT_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true

      - uses: bluefireteam/melos-action@68b03fa391f4242e956f7e39e9ee27c096b901e4 # v3.1.0
        with:
          run-bootstrap: false

      - name: Configure git credentials for org dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com" > ~/.git-credentials

      - name: Setup FVM symlink for Melos
        run: |
          mkdir -p .fvm
          ln -s $FLUTTER_ROOT .fvm/flutter_sdk

      - name: Bootstrap
        run: melos bootstrap

      - name: Analyze code
        run: melos analyze

      - name: Install Realm dependencies
        run: melos exec --depends-on="realm_dart" -- "dart run realm install"

      - name: Run tests
        run: melos exec --dir-exists="test" --fail-fast -- "flutter test"
