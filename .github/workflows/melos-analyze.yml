name: Melos Analyze

on:
  workflow_call:
    secrets:
      PAT_TOKEN:
        required: true
      SERVICE_ACCOUNT_JSON:
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MELOS_SDK_PATH: auto

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json
      # Job-level env so the step's `if:` guard can see it (step-level env is
      # NOT visible to that step's own `if:` condition).
      SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Configure git credentials for org dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com" > ~/.git-credentials

      - name: Copy service-account.json
        if: env.SERVICE_ACCOUNT_JSON != ''
        run: echo "$SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true

      - uses: bluefireteam/melos-action@2982f8e4fc92440a219490009d6d05195cb1a6a5 # v3.8.0

      - name: Install Realm native dependencies
        # realm_dart needs its native library next to the Dart SDK before
        # tests can run (dart test loads it via FFI). No-op in repos where no
        # package depends on realm_dart.
        run: |
          if melos list --depends-on="realm_dart" 2>/dev/null | grep -q .; then
            melos exec --depends-on="realm_dart" -- "dart run realm_dart install"
          else
            echo "No realm_dart dependents; skipping."
          fi

      - name: Analyze code
        run: melos analyze

      - name: Run tests
        run: |
          if melos run --list | awk '{print $1}' | grep -q "^test$"; then
            melos run test
          else
            echo "No test script found in Melos config. Skipping tests."
          fi
