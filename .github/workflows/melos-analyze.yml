name: Melos Analyze and Test

on:
  workflow_call:
    secrets:
      PAT_TOKEN:
        required: true
      SERVICE_ACCOUNT_JSON:
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MELOS_SDK_PATH: auto

jobs:
  analyze-and-test:
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json
      # Job-level env so the step's `if:` guard can see it (step-level env is
      # NOT visible to that step's own `if:` condition).
      SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: appbrewingcompany/.github/.github/actions/melos-setup@main
        with:
          pat-token: ${{ secrets.PAT_TOKEN }}

      # Must run AFTER checkout: actions/checkout deletes pre-existing
      # untracked files in the workspace, so a pre-checkout copy is wiped.
      - name: Copy service-account.json
        if: env.SERVICE_ACCOUNT_JSON != ''
        run: echo "$SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Analyze code
        run: melos analyze

      - name: Run tests
        run: |
          if melos run --list | awk '{print $1}' | grep -q "^test$"; then
            melos test --no-select
          else
            echo "No test script found in Melos config. Skipping tests."
          fi
