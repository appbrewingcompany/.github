# First-pass agent review (gh-aw) thin caller. Implementation lives centrally
# in appbrewingcompany/.github-private — change it there, once, for all repos.
#
# INERT until enabled (no red PRs while the engine secret is missing):
#   1. set the repo secret  ZAI_API_KEY  (z.ai GLM coding-plan key)
#   2. create the repo variable  AW_FIRST_PASS_REVIEW_ENABLED  = true
# Until then the job skips on every PR. The seeder does not copy
# ZAI_API_KEY — a repo admin must set it (org secret/plan key, never
# committed).
name: Agent First-Pass Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: aw-first-pass-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  call-aw-first-pass-review:
    # Enable switch: add the repo variable AW_FIRST_PASS_REVIEW_ENABLED=true
    # once the ZAI_API_KEY secret exists — before that the agent run would
    # fail its secret verification and go red on every PR.
    if: vars.AW_FIRST_PASS_REVIEW_ENABLED == 'true'
    uses: appbrewingcompany/.github-private/.github/workflows/aw-first-pass-review.lock.yml@main
    with:
      pr-number: ${{ github.event.pull_request.number }}
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: write
    secrets: inherit
